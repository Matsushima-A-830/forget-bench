# 規模曲線に描く戦略(色はこの順で固定。full_redact は full とほぼ同じ、kv_drop は kv_drop_repos とほぼ同じなので省く)
line_strategies: [full, window, summary, facts_append, rag, hybrid, kv_full, kv_drop_repos]
