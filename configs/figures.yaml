# 発表用の図(forget-bench figures)。runs/ は git 管理外なので、図と一緒に figures.json(数値と出所)を results/figures/ に残す。
runs:
  - label: "claude opus-5.5"
    run: runs/20261116-073132-sweep-claude-ja1     # 日本語 × seed 1000 × 5/20/50(縮小版)
  - label: "ollama qwen2.5 7B"
    run: runs/20261115-205757-sweep-ollama         # 日英 × seed 1000–1002 × 5/20/50
  - label: "hf qwen2.5 3B"
