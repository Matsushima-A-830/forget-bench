# 第3週: hf(KV層)の規模スイープ。テキスト層の全戦略と KV 層の4戦略を、ollama と同じシナリオで回す。
# GPU を使う前に nvidia-smi で空きを確認し、Ollama のモデルを降ろす(CLAUDE.md)。
# 事実抽出は ollama / claude と同じくセッション単位(extract_every: session)。
name: sweep-hf
backend:
  name: hf
  params:
    model: Qwen/Qwen2.5-3B-Instruct
    dtype: bfloat16
    attn_implementation: eager
    prefill_chunk: 512
generation:
  max_tokens: 256
  temperature: 0.0
scenario:
  langs: [ja, en]
  split: dev
  n_scenarios: 3
  sessions: [5, 20, 50]
  turns_per_session: [10, 20]
  n_attributes: 4
  max_changes: 4
  n_oneshot: 3
  n_sensitive: 3
  n_forget: 2
  aggregate_mentions: 4
strategies:
  - name: full
  - name: full_redact
  - name: window
    params: {n_turns: 10}
  - name: summary
  - name: facts_append
    params: {extract_every: session}
  - name: facts_append
    label: facts_append_oracle   # 抽出が完璧な場合の参照値(正解ラベルを使う)
    params: {extractor: oracle}
  - name: rag
  - name: hybrid
    params: {extract_every: session}
  - name: kv_full
  - name: kv_drop
  - name: kv_drop_repos
  - name: kv_evict_old
    params: {max_sessions: 2}
